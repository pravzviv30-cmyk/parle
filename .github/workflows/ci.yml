# The bar, running somewhere that is not a laptop.
#
# Until now `npm run gate` was enforced by two git hooks and good manners. Hooks live in
# `.githooks/` and are wired up by `npm install`, which means a clone that was never
# installed, a push with `--no-verify`, or a machine that skipped postinstall gets no check
# at all. This workflow is the copy of the bar that nobody can turn off from their own
# shell.
#
# Three steps, in the order that makes a failure readable:
#
#   1. the gate         — typecheck, every suite, the count floors, the agent pins, the
#                         secret scan, and the ledger. Exactly what `pre-push` runs.
#   2. dependency audit — `npm audit` read against the advisory decisions recorded in
#                         package.json under `luvani.dependencyAudit`. Fails on any high or
#                         critical advisory nobody has written a reachability argument for,
#                         and equally on an acceptance that no longer applies.
#   3. secret scan      — its own step as well as inside the gate, on purpose. If somebody
#                         ever needs to make the gate faster, this is the one check that
#                         must survive that decision, and a named step is harder to lose
#                         than a line inside a script. This is the tracked-file scan, which
#                         walks `git ls-files`. That reads the index, so it sees all 846
#                         tracked files at any clone depth — measured, not assumed. The
#                         history scan now streams all available refs without a commit cap,
#                         refuses shallow clones and runs as a mandatory separate step.
#
# **This workflow needs no secrets, and must not be given any.** Every suite was measured
# on 2026-08-25 with dotenv pointed at an empty file: 1547 tests, 0 failures, identical
# counts to a run with the developer's real `.env` present. A CI job holding a LiveKit
# secret or a Supabase service-role key is a second place for it to leak, and this one has
# no reason to hold either. `permissions: contents: read` says the same thing about the
# GitHub token.
#
# Node 24 because that is the version this repo is developed and verified on. `engines`
# still declares `>=22`, and that floor has never been run — see the ledger.

name: gate

on:
  push:
  pull_request:

# A second push supersedes the first. Nothing here is a deployment, so cancelling is free.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # `fetch-depth: 0` and not the default. The default is 1, and in a depth-1 clone of
      # this repository only the tip resolves: `refs/remotes/origin/main`, `2a86092`,
      # `f943bbe` and `2eac2f2` all fail to. The landing rule in
      # `services/token-server/src/verify/deliveryRoadmap.test.ts` asks git whether a
      # claimed hash exists and whether a branch is an ancestor of `main`, and it correctly
      # answers `unknown` rather than `no` in a shallow clone — so on the default it passed
      # by checking nothing, and F243, a stale landing claim on `main`, went straight
      # through the one check that guards a push from a machine with no hooks installed.
      #
      # Not a larger depth. Measured on 2026-08-30 against this repository: at `--depth 50`
      # the clone is still shallow and still carries no main ref, so the rule stays entirely
      # silent, and it already costs 6.4M of the 7.1M a full fetch costs. Depth buys history
      # but not refs; only 0 buys both, because that is the case where the action fetches
      # every head and every tag instead of one branch.
      #
      # The bill, measured the same day: 7.3M of .git against 3.3M, and about one second of
      # a twenty-minute job. `graphify-out/` is 55% of the packed history and grows roughly
      # 175K per regeneration, so this stays cheap for years rather than forever. Revisit if
      # a clone ever costs more than a suite.
      - name: check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 verified 2026-10-04
        with:
          fetch-depth: 0

      - name: node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 verified 2026-10-04
        with:
          node-version: '24.16.0'
          cache: npm

      # `npm ci` and never `npm install`: CI installs the lockfile as written, so a
      # dependency decision recorded in package-lock.json is the one that gets tested.
      # It runs from the repository root, which is also the only place the gate is
      # allowed to run — a worktree has no node_modules of its own and binds the wrong
      # copy of @anthropic-ai/sdk. See CLAUDE.md.
      - name: install
        run: npm ci

      - name: the gate
        run: npm run gate

      - name: dependency audit
        run: npm run audit:ci

      - name: secret scan
        run: npm run scan:secrets

      - name: full secret history scan
        run: npm run scan:secrets:history
