# Local scrape wiring only. Receiver, secure Prometheus ingress, retention and
# operator-reviewed targets/thresholds remain deployment acceptance.
global:
  scrape_interval: 15s
  scrape_timeout: 7s
rule_files:
  - observability.rules.yml
scrape_configs:
  - job_name: luvani-api-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9464']
